<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Кредитный калькулятор</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .row { margin-bottom: 12px; }
        input { padding: 8px; width: 320px; }
        button { padding: 10px 16px; cursor: pointer; }
        .error { color: red; font-size: 14px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f3f3f3; }
        .top { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .notice { padding: 12px; background: #fff3cd; border: 1px solid #ffeeba; margin-bottom: 15px; border-radius: 6px; }
        .status-pending { color: #b7791f; font-weight: bold; }
        .status-approved { color: green; font-weight: bold; }
        .status-cancelled { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="top">
    <div sec:authorize="hasRole('MANAGER')">
        <a th:href="@{/requests}">
            <button type="button">Список всех заявок</button>
        </a>
    </div>

    <div>
        <a th:href="@{/history}">
            <button type="button">Моя история</button>
        </a>
    </div>

    <div sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post">
            <button type="submit">Выйти</button>
        </form>
    </div>

    <div sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}">
            <button type="button">Войти</button>
        </a>
    </div>
</div>

<div class="notice" sec:authorize="hasRole('MANAGER')" th:if="${pendingCount != null and pendingCount > 0}">
    Новые заявки ожидают решения: <span th:text="${pendingCount}"></span>
</div>

<h2>Кредитный калькулятор</h2>

<form th:action="@{/calculate}" th:object="${creditForm}" method="post">
    <div class="row">
        <label>ФИО</label><br>
        <input type="text" th:field="*{fullName}">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div class="row">
        <label>Телефон</label><br>
        <input type="text" th:field="*{phone}" placeholder="+77771234567">
        <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>

    <div class="row">
        <label>Сумма кредита</label><br>
        <input type="number" step="0.01" th:field="*{principal}">
        <div class="error" th:if="${#fields.hasErrors('principal')}" th:errors="*{principal}"></div>
    </div>

    <div class="row">
        <label>Срок (месяцев)</label><br>
        <input type="number" th:field="*{months}">
        <div class="error" th:if="${#fields.hasErrors('months')}" th:errors="*{months}"></div>
    </div>

    <button type="submit">Рассчитать</button>
</form>

<div th:if="${myRequests != null and !myRequests.isEmpty()}">
    <h3>Мои последние расчёты</h3>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>Телефон</th>
            <th>Сумма</th>
            <th>Срок</th>
            <th>Платёж</th>
            <th>Итого</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="req : ${myRequests}">
            <td th:text="${req.id}"></td>
            <td th:text="${req.fullName}"></td>
            <td th:text="${req.phone}"></td>
            <td th:text="${req.principal}"></td>
            <td th:text="${req.months}"></td>
            <td th:text="${req.monthlyPayment}"></td>
            <td th:text="${req.totalPaid}"></td>
            <td>
                <span th:if="${req.status.name() == 'PENDING'}" class="status-pending">Ожидает решения</span>
                <span th:if="${req.status.name() == 'APPROVED'}" class="status-approved">Одобрен</span>
                <span th:if="${req.status.name() == 'CANCELLED'}" class="status-cancelled">Отклонён</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
