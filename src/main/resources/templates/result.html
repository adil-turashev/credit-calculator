<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Результат расчёта</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f3f3f3; }
        .status-pending { color: #b7791f; font-weight: bold; }
        .status-approved { color: green; font-weight: bold; }
        .status-cancelled { color: red; font-weight: bold; }
        button { padding: 10px 16px; cursor: pointer; }
    </style>
</head>
<body>
<h2>Результат</h2>

<p><b>ФИО:</b> <span th:text="${result.fullName}"></span></p>
<p><b>Телефон:</b> <span th:text="${result.phone}"></span></p>
<p><b>Сумма кредита:</b> <span th:text="${result.principal}"></span></p>
<p><b>Срок:</b> <span th:text="${result.months}"></span> мес.</p>

<p>
    <b>Дата и время запроса:</b>
    <span th:text="${#temporals.format(result.requestedAt, 'dd.MM.yyyy HH:mm:ss')}"></span>
</p>

<p>
    <b>Статус заявки:</b>
    <span th:if="${result.status.name() == 'PENDING'}" class="status-pending">Ожидает решения</span>
    <span th:if="${result.status.name() == 'APPROVED'}" class="status-approved">Одобрен</span>
    <span th:if="${result.status.name() == 'CANCELLED'}" class="status-cancelled">Отклонён</span>
</p>

<p><b>Месячная ставка:</b> <span th:text="${result.monthlyRate}"></span></p>
<p><b>Ежемесячный платёж:</b> <span th:text="${result.monthlyPayment}"></span></p>
<p><b>Итого к оплате:</b> <span th:text="${result.totalPaid}"></span></p>

<h3>График платежей</h3>

<table>
    <thead>
    <tr>
        <th>Месяц</th>
        <th>Проценты</th>
        <th>Основной долг</th>
        <th>Платёж</th>
        <th>Остаток</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="row : ${result.schedule}">
        <td th:text="${row.monthNumber}"></td>
        <td th:text="${row.interest}"></td>
        <td th:text="${row.principalPart}"></td>
        <td th:text="${row.payment}"></td>
        <td th:text="${row.balanceAfter}"></td>
    </tr>
    </tbody>
</table>

<br>

<a th:href="@{/calculator}">
    <button type="button">Назад к калькулятору</button>
</a>

<a th:href="@{/history}">
    <button type="button">Моя история</button>
</a>

<a th:href="@{/}">
    <button type="button">На главную</button>
</a>

</body>
</html>
