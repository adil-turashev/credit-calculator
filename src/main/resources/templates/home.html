<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Добро пожаловать</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; }
    .btn { display: block; width: 300px; padding: 20px; margin: 10px; font-size: 20px; text-align: center; text-decoration: none; color: white; background-color: #007bff; border: none; border-radius: 10px; cursor: pointer; }
    .btn:hover { background-color: #0056b3; }
    .btn-guest { background-color: #28a745; }
    .btn-guest:hover { background-color: #218838; }
  </style>
</head>
<body>
<h1>Кредитный </h1>
<a th:href="@{/login}" class="btn">Войти в аккаунт</a>
<a th:href="@{/register}" class="btn">Зарегистрироваться</a>
<a th:href="@{/calculator}" class="btn btn-guest">Продолжить без регистрации (как гость)</a>
</body>
</html>
